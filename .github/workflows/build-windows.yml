name: Build php_zmq Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        ts: ['nts', 'ts']

    steps:
      - name: Checkout php-zmq
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup PHP Environment
        uses: php/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: none
          tools: phpize
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Install ZeroMQ via vcpkg
        shell: cmd
        run: |
          vcpkg install zeromq:x64-windows
          vcpkg integrate install

      - name: Build Extension
        shell: cmd
        run: |
          call phpize

          REM Находим установленный vcpkg ZeroMQ
          set ZMQ_DIR=C:\vcpkg\installed\x64-windows

          call configure.bat --enable-zmq --with-zmq="%ZMQ_DIR%"
          nmake

          mkdir %GITHUB_WORKSPACE%\output
          copy /Y x64\Release*\php_zmq.dll %GITHUB_WORKSPACE%\output\ || copy /Y Release*\php_zmq.dll %GITHUB_WORKSPACE%\output\

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: php_zmq-${{ matrix.php-version }}-${{ matrix.ts }}-x64
          path: output/php_zmq.dll
