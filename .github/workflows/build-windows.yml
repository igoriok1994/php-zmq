name: Build php_zmq Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4.4']
        ts: ['nts', 'ts']

    steps:
      - name: Checkout php-zmq
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Bison and re2c Build Tools
        shell: pwsh
        run: |
          choco install -y winflexbison3 --params="/Compat"
          choco install -y re2c

          $winBison = Get-ChildItem -Path "C:\ProgramData\chocolatey" -Filter "win_bison.exe" -Recurse | Select-Object -First 1
          if ($winBison) {
              Copy-Item $winBison.FullName "C:\ProgramData\chocolatey\bin\bison.exe" -Force
          }

          bison --version
          re2c --version

      - name: Install ZeroMQ via vcpkg
        run: |
          vcpkg install zeromq:x64-windows

      - name: Prepare ZeroMQ Directory Structure
        shell: pwsh
        run: |
          $vcpkgRoot = "C:\vcpkg\installed\x64-windows"
          $zmqTarget = "C:\zmq"

          New-Item -ItemType Directory -Force -Path "$zmqTarget"
          New-Item -ItemType Directory -Force -Path "$zmqTarget\include"
          New-Item -ItemType Directory -Force -Path "$zmqTarget\include\zmq"
          New-Item -ItemType Directory -Force -Path "$zmqTarget\lib"

          # Копируем заголовки
          Copy-Item "$vcpkgRoot\include\*" "$zmqTarget\" -Force -Recurse
          Copy-Item "$vcpkgRoot\include\*" "$zmqTarget\include\" -Force -Recurse
          Copy-Item "$vcpkgRoot\include\*" "$zmqTarget\include\zmq\" -Force -Recurse

          # Копируем .lib файлы под всеми возможными именами
          $libs = Get-ChildItem -Path "$vcpkgRoot\lib" -Filter "*.lib"
          foreach ($lib in $libs) {
              Copy-Item $lib.FullName "$zmqTarget\$($lib.Name)" -Force
              Copy-Item $lib.FullName "$zmqTarget\lib\$($lib.Name)" -Force
              Copy-Item $lib.FullName "$zmqTarget\libzmq.lib" -Force
              Copy-Item $lib.FullName "$zmqTarget\lib\libzmq.lib" -Force
              Copy-Item $lib.FullName "$zmqTarget\zmq.lib" -Force
              Copy-Item $lib.FullName "$zmqTarget\lib\zmq.lib" -Force
          }

          Get-ChildItem -Path "$zmqTarget"

      - name: Download and Setup PHP & Devel Pack
        shell: pwsh
        run: |
          $ver = "${{ matrix.php-version }}"
          $isNts = "${{ matrix.ts }}" -eq "nts"
          $flavor = if ($isNts) { "nts-" } else { "" }

          $binName = "php-$ver-${flavor}Win32-vs17-x64.zip"
          $develName = "php-devel-pack-$ver-${flavor}Win32-vs17-x64.zip"

          function Download-PhpPackage ($filename, $targetPath) {
              $urls = @(
                  "https://windows.php.net/downloads/releases/$filename",
                  "https://windows.php.net/downloads/releases/archives/$filename",
                  "https://windows.php.net/downloads/qa/$filename",
                  "https://windows.php.net/downloads/qa/archives/$filename"
              )
              foreach ($url in $urls) {
                  try {
                      Write-Host "Trying $url..."
                      Invoke-WebRequest -Uri $url -OutFile $targetPath -UseBasicParsing -ErrorAction Stop
                      if ((Get-Item $targetPath).Length -gt 50000) {
                          Write-Host "Downloaded $filename ($((Get-Item $targetPath).Length) bytes)"
                          return
                      }
                  } catch {
                      Write-Host "Not found at $url, trying next..."
                  }
              }
              throw "Failed to download $filename from windows.php.net"
          }

          New-Item -ItemType Directory -Force -Path "C:\php"
          New-Item -ItemType Directory -Force -Path "C:\php-devel"
          New-Item -ItemType Directory -Force -Path "C:\temp-devel"

          Download-PhpPackage $binName "C:\php-bin.zip"
          Expand-Archive -Path "C:\php-bin.zip" -DestinationPath "C:\php" -Force

          Download-PhpPackage $develName "C:\php-devel.zip"
          Expand-Archive -Path "C:\php-devel.zip" -DestinationPath "C:\temp-devel" -Force

          $innerFolder = Get-ChildItem -Path "C:\temp-devel" -Directory | Select-Object -First 1
          if ($innerFolder) {
              Copy-Item -Path "$($innerFolder.FullName)\*" -Destination "C:\php-devel" -Recurse -Force
          } else {
              Copy-Item -Path "C:\temp-devel\*" -Destination "C:\php-devel" -Recurse -Force
          }

          # Добавляем заголовки и библиотеки также напрямую в Devel Pack
          Copy-Item "C:\zmq\include\*" "C:\php-devel\include\" -Recurse -Force
          Copy-Item "C:\zmq\lib\*" "C:\php-devel\lib\" -Recurse -Force

          "C:\php" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\php-devel" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify PHP Environment
        shell: pwsh
        run: |
          php -v

      - name: Build Extension
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          call C:\php-devel\phpize.bat

          set PHP_BUILD=C:\zmq
          REM shared,C:\zmq без внешних кавычек — ключевой параметр для сборки DLL
          call configure.bat --with-prefix=C:\php-devel --with-zmq=shared,C:\zmq --with-extra-includes=C:\zmq\include --with-extra-libs=C:\zmq\lib
          if %errorlevel% neq 0 exit /b %errorlevel%

          REM Проверка, что цель php_zmq.dll действительно создана в Makefile
          findstr /I "php_zmq.dll" Makefile
          if %errorlevel% neq 0 (
              echo ERROR: configure.bat did not enable zmq as a shared extension!
              exit /b 1
          )

          nmake
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: Smoke Test Extension
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "php_zmq.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
              throw "php_zmq.dll was not generated by nmake!"
          }
          Write-Host "Found compiled DLL: $($dll.FullName)"

          Copy-Item "C:\vcpkg\installed\x64-windows\bin\libzmq.dll" "C:\php\" -Force
          Copy-Item $dll.FullName "C:\php\ext\php_zmq.dll" -Force
          Set-Content -Path "C:\php\php.ini" -Value "extension=zmq"

          $loadedModules = php -m
          if ($loadedModules -match "zmq") {
              Write-Host "Verification successful: zmq extension successfully loaded!"
          } else {
              throw "Smoke test failed: zmq not found in php -m output"
          }

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\output"
          New-Item -ItemType Directory -Force -Path $outDir
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "php_zmq.dll" -Recurse | Select-Object -First 1
          Copy-Item $dll.FullName -Destination $outDir -Force
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\libzmq.dll" -Destination $outDir -Force

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: php_zmq-${{ matrix.php-version }}-${{ matrix.ts }}-x64
          path: output/*
