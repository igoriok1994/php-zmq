name: Build php_zmq Windows DLL

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag (leave empty for windows-<run number>)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4.27', '8.5.12']
        ts: ['nts', 'ts']

    steps:
      - name: Checkout php-zmq
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Bison and re2c Build Tools
        shell: pwsh
        run: |
          choco install -y winflexbison3 --params="/Compat"
          choco install -y re2c

          $winBison = Get-ChildItem -Path "C:\ProgramData\chocolatey" -Filter "win_bison.exe" -Recurse | Select-Object -First 1
          if ($winBison) {
              Copy-Item $winBison.FullName "C:\ProgramData\chocolatey\bin\bison.exe" -Force
          }

          bison --version
          re2c --version

      - name: Install ZeroMQ via vcpkg
        run: |
          vcpkg install zeromq:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed: $LASTEXITCODE" }

      - name: Prepare ZeroMQ Dependencies
        shell: pwsh
        run: |
          $VcpkgRoot = "C:\vcpkg\installed\x64-windows"
          $Destination = "C:\zmq"
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath "$VcpkgRoot\include\zmq.h")) {
              throw "ZeroMQ header missing: $VcpkgRoot\include\zmq.h"
          }

          # Match the import library to its DLL, excluding static libraries. Keep the
          # DLL's original name: it is embedded in the import library.
          $imports = @(Get-ChildItem -LiteralPath "$VcpkgRoot\lib" -Filter 'libzmq*.lib' |
              Where-Object { Test-Path -LiteralPath "$VcpkgRoot\bin\$($_.BaseName).dll" })
          if ($imports.Count -ne 1) {
              throw "Expected one shared ZeroMQ import library with a matching DLL; found $($imports.Count) in $VcpkgRoot"
          }

          New-Item -ItemType Directory -Force -Path "$Destination\include", "$Destination\lib", "$Destination\bin" | Out-Null
          Copy-Item "$VcpkgRoot\include\*.h" "$Destination\include\" -Force
          Copy-Item -LiteralPath $imports[0].FullName -Destination "$Destination\lib\libzmq.lib" -Force
          # Include transitive runtime dependencies, for example libsodium.
          Copy-Item "$VcpkgRoot\bin\*.dll" "$Destination\bin\" -Force
          Write-Host "ZeroMQ import library: $($imports[0].Name) -> libzmq.lib"
          Get-ChildItem "$Destination\lib", "$Destination\bin"

      - name: Download and Setup PHP & Devel Pack
        shell: pwsh
        run: |
          $ver = "${{ matrix.php-version }}"
          $isNts = "${{ matrix.ts }}" -eq "nts"
          $flavor = if ($isNts) { "nts-" } else { "" }

          $binName = "php-$ver-${flavor}Win32-vs17-x64.zip"
          $develName = "php-devel-pack-$ver-${flavor}Win32-vs17-x64.zip"

          function Download-PhpPackage ($filename, $targetPath) {
              $urls = @(
                  "https://windows.php.net/downloads/releases/archives/$filename",
                  "https://windows.php.net/downloads/releases/$filename"
              )
              foreach ($url in $urls) {
                  try {
                      Write-Host "Downloading $url..."
                      Invoke-WebRequest -Uri $url -OutFile $targetPath -UseBasicParsing -ErrorAction Stop
                      if ((Get-Item $targetPath).Length -gt 50000) {
                          Write-Host "Downloaded $filename ($((Get-Item $targetPath).Length) bytes)"
                          return
                      }
                  } catch {
                      Write-Host "Not found at $url, trying next..."
                  }
              }
              throw "Failed to download $filename from windows.php.net"
          }

          New-Item -ItemType Directory -Force -Path "C:\php"
          New-Item -ItemType Directory -Force -Path "C:\php-devel"
          New-Item -ItemType Directory -Force -Path "C:\temp-devel"

          # 1. Скачиваем бинарный PHP (для php.exe)
          Download-PhpPackage $binName "C:\php-bin.zip"
          Expand-Archive -Path "C:\php-bin.zip" -DestinationPath "C:\php" -Force

          # 2. Скачиваем Devel Pack (заголовки и phpize)
          Download-PhpPackage $develName "C:\php-devel.zip"
          Expand-Archive -Path "C:\php-devel.zip" -DestinationPath "C:\temp-devel" -Force

          $innerFolder = Get-ChildItem -Path "C:\temp-devel" -Directory | Select-Object -First 1
          if ($innerFolder) {
              Copy-Item -Path "$($innerFolder.FullName)\*" -Destination "C:\php-devel" -Recurse -Force
          } else {
              Copy-Item -Path "C:\temp-devel\*" -Destination "C:\php-devel" -Recurse -Force
          }

          "C:\php" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\php-devel" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify PHP Environment
        shell: pwsh
        run: |
          php -v

      - name: Fix legacy stdint include for PHP 8.4 and 8.5
        shell: pwsh
        run: |
          $headerPath = Join-Path $env:GITHUB_WORKSPACE 'php_zmq_private.h'
          $header = [IO.File]::ReadAllText($headerPath)
          $legacyInclude = '# include "win32/php_stdint.h"'
          if (-not $header.Contains($legacyInclude)) {
              throw 'Expected legacy stdint include was not found in php_zmq_private.h'
          }
          $header = $header.Replace($legacyInclude, '# include <stdint.h>')
          [IO.File]::WriteAllText($headerPath, $header)

      - name: Build Extension
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          call C:\php-devel\phpize.bat
          if %errorlevel% neq 0 exit /b %errorlevel%

          call configure.bat --with-zmq --with-php-build="C:\zmq" --with-prefix="C:\php"
          if %errorlevel% neq 0 exit /b %errorlevel%

          findstr /b /l /c:"php_zmq.dll:" Makefile
          if %errorlevel% neq 0 exit /b 1

          nmake /nologo php_zmq.dll
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: Smoke Test Extension
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "php_zmq.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
              throw "php_zmq.dll was not generated by nmake!"
          }
          Write-Host "Found compiled DLL: $($dll.FullName)"

          Copy-Item "C:\zmq\bin\*.dll" "C:\php\" -Force
          Copy-Item $dll.FullName "C:\php\ext\php_zmq.dll" -Force
          $expectedZts = if ("${{ matrix.ts }}" -eq "ts") { 1 } else { 0 }
          & C:\php\php.exe -n -r "exit(PHP_VERSION === '${{ matrix.php-version }}' && PHP_INT_SIZE === 8 && (int)PHP_ZTS === $expectedZts ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw "PHP version/architecture/TS mismatch" }
          & C:\php\php.exe -n -d extension_dir=C:\php\ext -d extension=php_zmq.dll -r 'if (!extension_loaded("zmq")) { exit(1); } $ctx = new ZMQContext(1, false); $socket = $ctx->getSocket(ZMQ::SOCKET_PAIR); echo "ZeroMQ socket created", PHP_EOL;'
          if ($LASTEXITCODE -ne 0) { throw "ZeroMQ load/socket smoke test failed" }

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\output"
          New-Item -ItemType Directory -Force -Path $outDir
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "php_zmq.dll" -Recurse | Select-Object -First 1
          Copy-Item $dll.FullName -Destination $outDir -Force
          Copy-Item "C:\zmq\bin\*.dll" -Destination $outDir -Force

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: php_zmq-${{ matrix.php-version }}-${{ matrix.ts }}-x64
          path: output/*
          if-no-files-found: error

  release:
    name: Publish Windows DLL release
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release-tag || format('windows-{0}', github.run_number) }}
      BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Download all four build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php_zmq-*
          path: artifacts

      - name: Create release ZIP archives
        shell: pwsh
        run: |
          $builds = @(Get-ChildItem artifacts -Directory)
          if ($builds.Count -ne 4) {
              throw "Expected four build artifacts, found $($builds.Count)"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          foreach ($build in $builds) {
              if (-not (Test-Path -LiteralPath (Join-Path $build.FullName 'php_zmq.dll'))) {
                  throw "php_zmq.dll missing in $($build.Name)"
              }
              Compress-Archive -Path "$($build.FullName)\*" -DestinationPath "release-assets\$($build.Name).zip" -Force
          }

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release-assets -Filter '*.zip' | ForEach-Object { $_.FullName })
          $notes = @(
              'Windows x64 builds of php_zmq for PHP 8.4 and 8.5, in TS and NTS variants.',
              '',
              'Each ZIP contains php_zmq.dll and the ZeroMQ runtime dependencies.',
              'Choose the PHP version and TS/NTS variant matching your PHP installation.',
              'Copy php_zmq.dll to the PHP ext directory and the other DLLs beside php.exe.',
              'Enable extension=php_zmq.dll in php.ini and restart PHP or the web server.',
              '',
              "Source commit: $env:BUILD_COMMIT"
          )
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release create "$env:RELEASE_TAG" @archives --repo "$env:GH_REPO" --target "$env:BUILD_COMMIT" --title "php_zmq Windows DLLs ($env:RELEASE_TAG)" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed; use a new tag if the release already exists' }
